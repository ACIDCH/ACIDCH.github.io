name: One-shot EX5 benchmark metadata correction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-security-refresh.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Correct current Australian Kia EV3 benchmark metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/data/geelyEx5AnzProductDefinition.ts")
          text = path.read_text()

          text, changed = re.subn(
              r'(id:\s*"au-kia-ev3-lr"[\s\S]*?dcKw:\s*)128,',
              r'\g<1>127,',
              text,
              count=1,
          )
          if changed != 1:
              raise SystemExit(f"Expected one Australian EV3 LR charging correction, changed {changed}")

          old_url = 'sourceUrl: "https://www.carexpert.com.au/kia/ev3",'
          if text.count(old_url) != 2:
              raise SystemExit(f"Expected two Kia Australia source URLs, found {text.count(old_url)}")
          text = text.replace(
              old_url,
              'sourceUrl: "https://www.carexpert.com.au/car-reviews/2026-kia-ev3-review",',
          )

          path.write_text(text)
          PY

      - name: Commit benchmark correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/geelyEx5AnzProductDefinition.ts
          git commit -m "Correct EX5 competitor benchmark metadata"
          git push origin HEAD:main
