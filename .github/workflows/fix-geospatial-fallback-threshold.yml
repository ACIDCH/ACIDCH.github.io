name: Temporary geospatial fallback threshold fix

on:
  push:
    branches:
      - fix/geospatial-random-scene-feasibility
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/geospatial-random-scene-feasibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Widen Fast OD recovery threshold for the randomized Auckland scene
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/scripts/geospatial-v4.js')
          text = path.read_text()
          old = 'q("geo4-threshold").value = "6";'
          new = 'q("geo4-threshold").value = "15";'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Fast OD fallback threshold assignment; found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          grep -q 'q("geo4-threshold").value = "15";' src/scripts/geospatial-v4.js
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-geospatial-fallback-threshold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: widen Fast OD recovery threshold for randomized scene'
          git push origin HEAD
