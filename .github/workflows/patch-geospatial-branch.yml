name: Temporary geospatial branch patch
on:
  push:
    branches:
      - feat/geospatial-randomized-auckland-scenario
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/patch-randomized-geospatial.cjs
      - name: Validate source
        run: |
          node --check src/scripts/geospatial-v4.js
          grep -q 'FACILITY_REGIONS' src/scripts/geospatial-v4.js
          grep -q 'DEMAND_REGIONS' src/scripts/geospatial-v4.js
          ! grep -q 'COMPACT_SCENES' src/scripts/geospatial-v4.js
          ! grep -q 'chooseSceneIndex' src/scripts/geospatial-v4.js
          grep -q 'weight: 8' src/scripts/geospatial-v4.js
          grep -q 'weight: 4.2' src/scripts/geospatial-v4.js
      - name: Commit patched source and remove temporary tooling
        run: |
          rm -f scripts/patch-randomized-geospatial.cjs .github/workflows/patch-geospatial-randomized.yml .github/workflows/patch-geospatial-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/scripts/geospatial-v4.js scripts/patch-randomized-geospatial.cjs .github/workflows/patch-geospatial-randomized.yml .github/workflows/patch-geospatial-branch.yml
          git commit -m 'feat: randomize Auckland geospatial supply chain scene'
          git push origin HEAD
