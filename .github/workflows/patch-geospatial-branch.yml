name: Temporary geospatial branch patch
on:
  push:
    branches:
      - feat/geospatial-randomized-auckland-scenario
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feat/geospatial-randomized-auckland-scenario'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Repair patch helper syntax
        run: |
          sed -i 's/const HQ = typedFacilities\.map((x) => `\${x\.name}, Auckland, New Zealand`);/const HQ = typedFacilities.map((x) => x.name + ", Auckland, New Zealand");/' scripts/patch-randomized-geospatial.cjs
          sed -i 's/const NQ = demands\.map((x) => `\${x\.name}, Auckland, New Zealand`);/const NQ = demands.map((x) => x.name + ", Auckland, New Zealand");/' scripts/patch-randomized-geospatial.cjs
      - name: Apply patch
        run: node scripts/patch-randomized-geospatial.cjs
      - name: Validate source
        run: |
          node --check src/scripts/geospatial-v4.js
          grep -q 'FACILITY_REGIONS' src/scripts/geospatial-v4.js
          grep -q 'DEMAND_REGIONS' src/scripts/geospatial-v4.js
          ! grep -q 'COMPACT_SCENES' src/scripts/geospatial-v4.js
          ! grep -q 'chooseSceneIndex' src/scripts/geospatial-v4.js
          grep -q 'weight: 8' src/scripts/geospatial-v4.js
          grep -q 'weight: 4.2' src/scripts/geospatial-v4.js
      - name: Commit patched source and remove temporary tooling
        run: |
          rm -f scripts/patch-randomized-geospatial.cjs .github/workflows/patch-geospatial-randomized.yml .github/workflows/patch-geospatial-branch.yml scripts/.geo-patch-trigger scripts/.geo-patch-trigger-2 scripts/.geo-patch-trigger-3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: randomize Auckland geospatial supply chain scene'
          git push origin HEAD
