name: Website CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    pages-${{ (github.event_name == 'push' || github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch') && 'main' || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, test and build
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && 'main' || github.sha }}

      - name: Resolve checked-out revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize formatting in the build workspace
        run: npm run format

      - name: Verify formatting produced no whitespace errors
        run: git diff --check

      - name: Report files normalized by Prettier
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
          else
            echo "::notice::Prettier normalized these files in the build workspace:"
            git diff --name-only
          fi

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Lint JavaScript and TypeScript
        run: npm run lint

      - name: Run tests and public-content security scan
        run: npm run test

      - name: Enforce strict bilingual sync parity
        run: npm run audit:i18n-sync:strict

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Build and validate static site
        run: npm run build

      - name: Run final bilingual acceptance audit
        run: npm run audit:i18n-final

      - name: Install CJK fonts for visual proofs
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Capture SQL 01–09 visual proofs
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/capture-pr-sql-visuals.py
          python3 scripts/capture-pr-sql08-visuals.py
          python3 scripts/capture-pr-sql09-visuals.py

      - name: Capture decision-model visual proofs
        if: github.event_name == 'pull_request'
        run: python3 scripts/capture-pr-decision-model-visuals.py

      - name: Capture regression and floating-tag visual proofs
        if: github.event_name == 'pull_request'
        run: python3 scripts/capture-pr-regression-visuals.py

      - name: Capture R data-science and productivity visual proofs
        if: github.event_name == 'pull_request'
        run: python3 scripts/capture-pr-data-science-visuals.py

      - name: Capture statistics-series visual proofs
        if: github.event_name == 'pull_request'
        run: python3 scripts/capture-pr-statistics-visuals.py

      - name: Upload pull-request static artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-static-site-${{ github.event.pull_request.number }}
          path: |
            dist
            visual-proofs
            decision-proofs
            regression-proofs
            data-science-proofs
            statistics-proofs
          if-no-files-found: error
          retention-days: 3

      - name: Write deployment identity
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_NUMBER: ${{ github.run_number }}
        run: npm run deploy:meta

      - name: Configure GitHub Pages
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy verified artifact
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    name: Verify live deployment
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    needs: [quality, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.quality.outputs.deploy_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Confirm production matches this commit
        run: |
          npm run verify:production -- "${{ needs.deploy.outputs.page_url }}" "${{ needs.quality.outputs.deploy_sha }}"
          node scripts/verify-sql08-production.mjs "${{ needs.deploy.outputs.page_url }}" "${{ needs.quality.outputs.deploy_sha }}"
          node scripts/verify-sql09-production.mjs "${{ needs.deploy.outputs.page_url }}" "${{ needs.quality.outputs.deploy_sha }}"
          node scripts/verify-decision-models-production.mjs "${{ needs.deploy.outputs.page_url }}" "${{ needs.quality.outputs.deploy_sha }}"
          node scripts/verify-regression-production.mjs "${{ needs.deploy.outputs.page_url }}" "${{ needs.quality.outputs.deploy_sha }}"
          node scripts/verify-data-science-production.mjs "${{ needs.deploy.outputs.page_url }}" "${{ needs.quality.outputs.deploy_sha }}"
          node scripts/verify-statistics-production.mjs "${{ needs.deploy.outputs.page_url }}" "${{ needs.quality.outputs.deploy_sha }}"

      - name: Publish auditable production verification receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.quality.outputs.deploy_sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          state="failure"
          description="GitHub Pages live verification failed"
          if [ "${{ job.status }}" = "success" ]; then
            state="success"
            description="GitHub Pages live verification passed"
          fi

          payload=$(jq -n \
            --arg state "$state" \
            --arg context "production/live-verification" \
            --arg description "$description" \
            --arg target_url "$RUN_URL" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$REPOSITORY/statuses/$TARGET_SHA" \
            --data "$payload"
