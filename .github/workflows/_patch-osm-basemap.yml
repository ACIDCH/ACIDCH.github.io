name: Patch OSM basemap

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace API-key Carto basemap with OSM tiles
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/scripts/geospatial-v4.js")
          text = path.read_text(encoding="utf-8")
          old = 'L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {\n    maxZoom: 20,\n    subdomains: "abcd",\n    attribution:\n      \'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; CARTO\',\n  }).addTo(map);'
          new = 'L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {\n    maxZoom: 19,\n    attribution:\n      \'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors\',\n  }).addTo(map);'
          if old not in text:
              raise SystemExit("Expected Carto basemap block not found; refusing to modify the file.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify no Carto basemap remains in geospatial-v4
        run: |
          ! grep -n "basemaps\.cartocdn\.com\|cartodb\|carto" src/scripts/geospatial-v4.js

      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/geospatial-v4.js
          git commit -m "fix: use OSM basemap without API key"
          git rm .github/workflows/_patch-osm-basemap.yml
          git commit -m "chore: remove temporary basemap patch workflow"
          git push origin HEAD
