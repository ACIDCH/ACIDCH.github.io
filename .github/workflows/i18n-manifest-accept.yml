name: Temporary i18n manifest accept

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  accept-manifest:
    if: github.head_ref == 'codex/remove-placeholder-projects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Accept verified SQL bilingual sync
        run: node scripts/i18n-sync.mjs --write --accept=notes:sql-select

      - name: Commit accepted manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .i18n/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already accepted."
            exit 0
          fi
          git commit -m "Accept verified SQL bilingual sync"
          git push origin HEAD:${{ github.head_ref }}
