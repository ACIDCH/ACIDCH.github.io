name: Temporary geospatial reset fix

on:
  push:
    branches:
      - fix/geospatial-random-scene-feasibility
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'fix/geospatial-random-scene-feasibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Make reset use the randomized-scene facility ceiling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/scripts/geospatial-v4.js')
          text = path.read_text()
          old = 'maxOpen = Math.max(1, Math.min(2, H.length));'
          new = 'maxOpen = Math.max(1, Math.min(5, H.length));'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one reset/base-scene maxOpen assignment; found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          grep -q 'maxOpen = Math.max(1, Math.min(5, H.length));' src/scripts/geospatial-v4.js
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-geospatial-reset-max-open.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve five-facility ceiling on randomized reset'
          git push origin HEAD
