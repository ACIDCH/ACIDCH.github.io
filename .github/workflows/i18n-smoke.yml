name: Temporary i18n translation smoke test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  translation-smoke:
    if: github.head_ref == 'codex/remove-placeholder-projects'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate a real translation draft in tmp
        run: >-
          node scripts/i18n-translate.mjs
          --source=src/content/notes/foundation.zh.md
          --target=tmp/foundation-smoke.en.md
          --provider=google-draft

      - name: Verify protected structure and language output
        shell: bash
        run: |
          node scripts/i18n-protected.mjs src/content/notes/foundation.zh.md tmp/foundation-smoke.en.md
          test -s tmp/foundation-smoke.en.md
          if grep -P '[\x{3400}-\x{9fff}]' tmp/foundation-smoke.en.md; then
            echo 'Translated smoke output still contains Han text.' >&2
            exit 1
          fi
          echo 'Real translation smoke test passed.'
